name: l10n

on:
  pull_request:
    branches:
      - main
    paths:
      - "ui/flutter/lib/l10n/**"
      - "ui/flutter/l10n.yaml"
      - ".github/workflows/scripts/check_l10n.dart"
      - ".github/workflows/l10n.yml"
  push:
    branches:
      - main
    paths:
      - "ui/flutter/lib/l10n/**"
      - "ui/flutter/l10n.yaml"
      - ".github/workflows/scripts/check_l10n.dart"
      - ".github/workflows/l10n.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l10n-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  validate:
    name: Validate Flutter translations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Validate ARB catalogs
        run: dart run ../../.github/workflows/scripts/check_l10n.dart
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Analyze generated localization integration
        run: flutter analyze
