name: Verify Windows package artifacts

on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  verify-windows-amd64:
    runs-on: windows-2022
    steps:
      - name: Download Windows AMD64 test packages
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64-packages
          run-id: 39983177333
          github-token: ${{ github.token }}
          path: packages
      - name: Verify package integrity and runtime architecture
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import struct
          import zipfile

          root = Path('packages')
          portable_path = next(root.glob('*-portable.zip'))
          installer_path = next(root.glob('*.exe'))
          installer_zip_path = next(p for p in root.glob('*.zip') if p != portable_path)
          print('Artifacts:')
          for path in sorted(root.iterdir()):
              print(f'  {path.name}: {path.stat().st_size:,} bytes')


          def pe_info(data):
              assert data[:2] == b'MZ'
              offset = struct.unpack_from('<I', data, 0x3c)[0]
              assert data[offset:offset + 4] == b'PE\0\0'
              machine, sections = struct.unpack_from('<HH', data, offset + 4)
              optional_size = struct.unpack_from('<H', data, offset + 20)[0]
              optional = offset + 24
              magic = struct.unpack_from('<H', data, optional)[0]
              directories = optional + (112 if magic == 0x20b else 96)
              imports_rva = struct.unpack_from('<I', data, directories + 8)[0]
              section_table = optional + optional_size
              def file_offset(rva):
                  for i in range(sections):
                      address = section_table + 40 * i
                      virtual_size, virtual_address, raw_size, raw_offset = struct.unpack_from('<IIII', data, address + 8)
                      if virtual_address <= rva < virtual_address + max(virtual_size, raw_size):
                          return raw_offset + rva - virtual_address
                  raise ValueError(f'Unmapped RVA: {rva:#x}')
              imports = []
              if imports_rva:
                  position = file_offset(imports_rva)
                  while any(data[position:position + 20]):
                      name_rva = struct.unpack_from('<I', data, position + 12)[0]
                      name_offset = file_offset(name_rva)
                      imports.append(data[name_offset:data.index(b'\0', name_offset)].decode('ascii'))
                      position += 20
              return machine, imports

          with zipfile.ZipFile(portable_path) as portable:
              assert portable.testzip() is None
              names = {name.lower(): name for name in portable.namelist()}
              required = ['gopeed.exe', 'libgopeed.dll', 'libstdc++-6.dll', 'libgcc_s_seh-1.dll', 'libwinpthread-1.dll', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll']
              for name in required:
                  assert name in names, f'Missing portable runtime: {name}'
                  machine, imports = pe_info(portable.read(names[name]))
                  assert machine == 0x8664, f'Wrong architecture for {name}: {machine:#x}'
                  for dependency in imports:
                      if dependency.lower().startswith(('libgcc', 'libstdc++', 'libwinpthread')):
                          assert dependency.lower() in names, f'Missing dependency: {name} -> {dependency}'
                  print(f'PASS: AMD64 {name}; imports: {", ".join(imports)}')
              print(f'PASS: Portable ZIP integrity ({len(names)} entries) and runtime dependency checks')

          with zipfile.ZipFile(installer_zip_path) as installer_zip:
              assert installer_zip.testzip() is None
              assert installer_zip.namelist() == [installer_path.name]
              assert hashlib.sha256(installer_zip.read(installer_path.name)).digest() == hashlib.sha256(installer_path.read_bytes()).digest()
              assert installer_path.read_bytes()[:2] == b'MZ'
              print('PASS: Installer ZIP integrity; embedded installer matches the standalone EXE')
