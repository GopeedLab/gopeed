name: WebView host profiles
on:
  push:
    paths: ['go.mod', 'go.sum', 'internal/webview/**', 'pkg/download/extension_webview*', 'ui/flutter/third_party/**', 'ui/flutter/lib/app/rpc/webview*', 'ui/flutter/tool/webview_profile_check.dart', '.github/workflows/webview-profiles.yml']
  pull_request:
    paths: ['go.mod', 'go.sum', 'internal/webview/**', 'pkg/download/extension_webview*', 'ui/flutter/third_party/**', 'ui/flutter/lib/app/rpc/webview*', 'ui/flutter/tool/webview_profile_check.dart', '.github/workflows/webview-profiles.yml']
  workflow_dispatch:
jobs:
  android-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
      - run: flutter pub get
        working-directory: ui/flutter
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compile Android native plugin
        working-directory: ui/flutter/android
        run: |
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > local.properties
          gradle :flutter_inappwebview_android:compileDebugJavaWithJavac
  apple-plugin:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
      - name: Build Go host
        run: go build -buildmode=c-shared -o ui/flutter/macos/Frameworks/libgopeed.dylib ./bind/desktop
      - name: Check native macOS profiles
        working-directory: ui/flutter
        run: |
          flutter pub get
          flutter build macos --debug -t tool/webview_profile_check.dart
          build/macos/Build/Products/Debug/Gopeed.app/Contents/MacOS/Gopeed
      - name: Compile iOS native plugin
        working-directory: ui/flutter
        run: |
          flutter build ios --simulator --config-only
          cd ios
          pod install
          xcodebuild -project Pods/Pods.xcodeproj -target flutter_inappwebview_ios -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
